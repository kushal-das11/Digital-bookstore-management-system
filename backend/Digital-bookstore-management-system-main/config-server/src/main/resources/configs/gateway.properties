eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=review-service
spring.cloud.gateway.routes[2].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.routes[3].id=inventory-service
spring.cloud.gateway.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.routes[4].id=catalog-service
spring.cloud.gateway.routes[4].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.routes[5].id=user-swagger
spring.cloud.gateway.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=USER-SERVICE
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

spring.cloud.gateway.routes[6].id=catalog-swagger
spring.cloud.gateway.routes[6].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/catalog-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

springdoc.swagger-ui.urls[1].name=CATALOG-SERVICE
springdoc.swagger-ui.urls[1].url=/catalog-service/v3/api-docs

spring.cloud.gateway.routes[7].id=order-swagger
spring.cloud.gateway.routes[7].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/order-service/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1

springdoc.swagger-ui.urls[2].name=ORDER-SERVICE
springdoc.swagger-ui.urls[2].url=/order-service/v3/api-docs

spring.cloud.gateway.routes[8].id=review-swagger
spring.cloud.gateway.routes[8].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/review-service/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=1

springdoc.swagger-ui.urls[3].name=REVIEW-SERVICE
springdoc.swagger-ui.urls[3].url=/review-service/v3/api-docs

spring.cloud.gateway.routes[9].id=inventory-swagger
spring.cloud.gateway.routes[9].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/inventory-service/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=StripPrefix=1

springdoc.swagger-ui.urls[4].name=INVENTORY-SERVICE
springdoc.swagger-ui.urls[4].url=/inventory-service/v3/api-docs

spring.cloud.gateway.routes[10].id=swagger-config
